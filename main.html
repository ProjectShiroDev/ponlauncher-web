<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pon Launcher | Магазин</title>
    <!-- ВАЖНО: Стили полностью скопированы с index.html -->
    <style>
        :root { --bg-color: #000000; --glass-bg: rgba(28, 28, 30, 0.65); --glass-border: rgba(255, 255, 255, 0.08); --text-primary: #FFFFFF; --text-secondary: #EBEBF599; --accent-blue: #0A84FF; --accent-blue-hover: #0070E0; --font-ios: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-ios); -webkit-font-smoothing: antialiased; }
        body { background-color: var(--bg-color); color: var(--text-primary); min-height: 100vh; display: flex; flex-direction: column; align-items: center; overflow-x: hidden; background-image: radial-gradient(circle at 50% 0%, #1a1a24 0%, #000000 70%); }
        .ios-nav { position: fixed; top: 24px; display: flex; gap: 8px; background: var(--glass-bg); backdrop-filter: blur(25px) saturate(200%); -webkit-backdrop-filter: blur(25px) saturate(200%); padding: 6px; border-radius: 40px; border: 1px solid var(--glass-border); z-index: 100; }
        .nav-tab { color: var(--text-secondary); text-decoration: none; padding: 10px 20px; border-radius: 30px; font-size: 15px; font-weight: 500; transition: all 0.2s ease; }
        .nav-tab.active { background-color: rgba(255, 255, 255, 0.15); color: var(--text-primary); }
        .nav-tab:hover:not(.active) { color: var(--text-primary); }
        main { margin-top: 140px; width: 100%; max-width: 800px; padding: 0 24px; display: flex; flex-direction: column; align-items: center; flex: 1; text-align: center; animation: fadeIn 0.3s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .hero-title { font-size: 56px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 12px; }
        .hero-subtitle { font-size: 22px; font-weight: 400; color: var(--text-secondary); margin-bottom: 48px; max-width: 500px; }
        .widgets-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; width: 100%; margin-bottom: 60px; }
        .widget-card { background: var(--glass-bg); backdrop-filter: blur(20px) saturate(150%); border: 1px solid var(--glass-border); border-radius: 24px; padding: 24px; text-align: left; display: flex; flex-direction: column; gap: 12px; }
        .widget-card.full-width { grid-column: span 2; flex-direction: row; align-items: center; justify-content: space-between; }
        .widget-icon { width: 40px; height: 40px; background: var(--accent-blue); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .widget-icon.green { background: #32D74B; }
        .widget-title { font-size: 17px; font-weight: 600; color: var(--text-primary); }
        .widget-text { font-size: 15px; color: var(--text-secondary); line-height: 1.4; }
        footer { width: 100%; text-align: center; padding: 30px 20px; color: var(--text-secondary); font-size: 14px; border-top: 1px solid var(--glass-border); background: rgba(0, 0, 0, 0.3); backdrop-filter: blur(10px); margin-top: 40px; }
        @media (max-width: 600px) { .widgets-grid { grid-template-columns: 1fr; } .widget-card.full-width { grid-column: span 1; flex-direction: column; align-items: flex-start; } .hero-title { font-size: 42px; } .ios-nav { width: 90%; justify-content: space-between; } .nav-tab { padding: 10px 12px; font-size: 13px; } }
    </style>
</head>
<body>

    <nav class="ios-nav">
        <a href="/download" class="nav-tab">Загрузка</a>
        <a href="/main" class="nav-tab active">Магазин</a>
        <a href="/updates" class="nav-tab">Обновления</a>
        <a href="/profile" class="nav-tab">Профиль</a>
    </nav>

    <main>
        <h1 class="hero-title">Магазин</h1>
        <p class="hero-subtitle">Внутриигровые предметы, скины и эксклюзивные предложения.</p>

        <div class="widgets-grid">
            <div class="widget-card full-width">
                <div>
                    <h3 class="widget-title">Витрина скоро откроется</h3>
                    <p class="widget-text" style="margin-top: 8px;">Мы готовим каталог товаров для запуска. Следите за обновлениями!</p>
                </div>
                <div class="widget-icon green">🛍️</div>
            </div>
        </div>
    </main>

    <footer>
        &copy; 2026 Pon Launcher. Все права защищены.
    </footer>

</body>
</html>
